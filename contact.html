<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contáctanos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <div id="contacts">
        <div class="container2">
            <div class="cntct-item">
                <div class="contact">
                    <div class="ftext">Ponte en contacto</div>
                    <img src="Imagenes/img-contact.jpg" alt="" class="cntct-img">
                    <div class="social-links">
                        <span class="stext">Contáctanos:</span>
                        <ul class="social-media">
                            <li><a href="https://www.facebook.com/share/17d3QvMd1W/"><i class="fa fa-facebook-square" karla-aparicio="true"></i></a></li>
                            <li><a href="https://x.com/buzvintxe?t=EAed1HD4SByYOv4NqZ5Ezg&s=08"><i class="fa fa-twitter" karla="true"></i></a></li>
                            <li><a href="https://www.instagram.com/karla.aparicioo?igsh=MXJwcmxtNjF1b28xag=="><i class="fa fa-instagram" karla="true"></i></a></li>
                            <li><a href="https://youtube.com/@karlaaparicio7306?si=k8_T5t7HMiGPbi3y"><i class="fa fa-youtube-play" karla-aparicio="true"></i></a></li>
                        </ul>
                    </div>
                </div>
                <div class="send-form">
                    <h4 class="ttext">Contáctanos</h4>
                    <form action="">
                        <div class="inputbox">
                            <input type="text" class="input" required>
                            <label for="">Nombre</label>
                        </div>
                        <div class="inputbox">
                            <input type="tel" class="input" required>
                            <label for="">Teléfono</label>
                        </div>
                        <div class="inputbox">
                            <textarea name="" class="input" required id="message" cols="30" rows="10"></textarea>
                            <label for="">Mensaje</label>
                        </div>
                        <input type="submit" class="btn-send" value="Enviar">
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
